name: plan-mode
version: "0.3.4"
description: "Enforced plan mode with Claude Code-style approval on every interactive Hermes surface. /plan or /planmode on blocks mutating tools dispatched through pre_tool_call, except plan writes under .hermes/plans. The agent submits the plan with plan_mode(submit) and you approve it through Hermes' own approval prompt (buttons, card, CLI panel or /approve); it then implements in the same turn and tracks todo_list progress. Deny keeps planning. Gateway/TUI/Desktop need Hermes v2026.9.24. Not enforced: Codex app-server exec/applyPatch, TUI /background and btw."
author: 100yenadmin
kind: standalone
requires_hermes: ">=0.21.2"
provides_tools:
  - plan_mode
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - transform_llm_output
  - pre_approval_request
  - post_approval_response
  - on_session_finalize
  - on_session_reset
config_schema:
  enforce_builtin_plan:
    type: bool
    default: true
    label: Enforce core /plan
    description: Core /plan turns on enforced plan mode for the session, so writes wait for your approval.
  agent_hint:
    type: bool
    default: true
    label: Agent hint
    description: Adds a short system-prompt hint naming the plan_mode tool. Applies to new sessions.
  footer:
    type: str
    choices: [auto, "off"]
    default: auto
    label: Chat footer
    description: A one-line plan-mode or progress footer under short replies on chat platforms.
  plan_style:
    type: str
    choices: [compact, core]
    default: core
    label: Plan style
    description: "compact writes a short, decision-complete plan (the Claude Code and Codex style). core keeps Hermes' /plan craft: zero-context tasks, full code and a commit per step."
  allow_commits:
    type: bool
    default: true
    label: Allow commits
    description: Off tells the agent not to plan or make git commits unless you ask, so the changes stay uncommitted for your review.
  plan_skill:
    type: str
    default: ""
    label: Plan skill
    description: The name of a skill whose plan format to use instead, such as your own planning contract. Empty uses Plan style.
  extra_allowed_tools:
    type: list
    default: []
    label: Extra read-only tools
    description: Exact tool names you vouch for as read-only. Plan mode lets them run while planning.

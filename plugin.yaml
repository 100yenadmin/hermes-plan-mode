name: plan-mode
version: "0.1.7"
description: "Enforced plan mode: /planmode on blocks mutating tools via pre_tool_call, except plan writes under .hermes/plans, until /planmode approve. Gateway/TUI/Desktop need Hermes v2026.9.24. A plan is approvable after post_tool_call reports success (hosts without tool_call_id: pre-write tracking). Not enforced: Codex app-server exec/applyPatch, TUI /background and btw. Adds a plan-mode turn note."
author: 100yenadmin
kind: standalone
requires_hermes: ">=0.21.2"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - on_session_finalize
  - on_session_reset

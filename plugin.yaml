name: plan-mode
version: "0.1.7"
description: "Enforced per-session plan mode: /planmode on blocks mutating Hermes tools dispatched through pre_tool_call, except plan writes under .hermes/plans, until /planmode approve. Enforced in the classic CLI on released Hermes (≤ 0.21.4, tag v2026.9.21). Gateway/TUI/Desktop need a Hermes build that includes NousResearch/hermes-agent commits 5943347a2a (gateway) and 35fdb4608a (TUI/Desktop), which landed on main after v2026.9.21 and are in no release tag yet; earlier builds refuse /planmode on there instead of pretending. Disclosure — Hermes Codex app-server native exec/applyPatch and TUI /background and btw side agents bypass pre_tool_call and are not enforced; while plan mode is active, pre_llm_call adds a short plan-mode note to each turn's context."
author: 100yenadmin
kind: standalone
requires_hermes: ">=0.21.2"
provides_tools: []
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - on_session_finalize
  - on_session_reset

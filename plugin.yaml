name: plan-mode
version: "0.6.7"
description: "Enforced plan mode with Claude Code-style approval on every interactive Hermes surface. /plan or /planmode on blocks mutating tools dispatched through pre_tool_call, except plan writes under .hermes/plans. The agent submits the plan with plan_mode(submit) and you approve it on one card (approve and auto-accept edits, approve and review each file edit, or keep planning; Other sends feedback), or through Hermes' own approval prompt on the classic profile and surfaces without a card; it then implements in the same turn and tracks todo_list progress. Keep planning revises the plan. Gateway/TUI/Desktop need Hermes 0.21.5 (v2026.9.24) or newer; 0.21.6 recommended. Not enforced: Codex app-server exec/applyPatch, TUI /background and btw."
author: 100yenadmin
kind: standalone
requires_hermes: ">=0.21.3"
provides_tools:
  - plan_mode
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - transform_llm_output
  - pre_approval_request
  - post_approval_response
  - on_session_finalize
  - on_session_reset
  - post_llm_call
  - transform_tool_result
  - post_api_request
config_schema:
  enforce_builtin_plan:
    type: bool
    default: true
    label: Enforce core /plan
    description: Core /plan turns on enforced plan mode for the session, so writes wait for your approval.
  agent_hint:
    type: bool
    default: true
    label: Agent hint
    description: Adds a short system-prompt hint naming the plan_mode tool. Applies when Hermes next loads plugins (a new CLI process, or a gateway or app restart).
  footer:
    type: str
    choices: [auto, "off"]
    default: auto
    label: Chat footer
    description: A one-line plan-mode or progress footer under short replies on chat platforms. Off also turns off the line that tells you how to approve a plan still waiting for approval.
  plan_style:
    type: str
    choices: [compact, core]
    default: compact
    label: Plan style
    description: "compact writes a short, decision-complete plan (the Claude Code and Codex style). core keeps Hermes' /plan craft: zero-context tasks, full code and a commit per step."
  plan_profile:
    type: str
    choices: ["lean", "classic"]
    default: "lean"
    label: Plan profile
    description: "lean (default) makes compact plans faster and leaner: shorter planning notes, fewer bookkeeping calls, a Codex-style plan format and bounded clarifying questions. It applies with Plan style compact and no Plan skill. classic keeps the 0.3.5 behaviour."
  approval_card:
    type: bool
    default: true
    label: Approval card
    description: "Ask for plan approval with one card in the lean profile; off uses Hermes' approval prompt. Change it between plans: it takes effect at once, and turning it off stops per-edit review of a running plan."
  allow_commits:
    type: bool
    default: false
    label: Allow commits
    description: Off tells the agent not to plan or make git commits unless you ask, so the changes stay uncommitted for your review.
  plan_skill:
    type: str
    default: ""
    label: Plan skill
    description: The name of a skill whose plan format to use instead, such as your own planning contract. Empty uses Plan style, as does a blocked skill_view (skills.inline_shell on).
  extra_allowed_tools:
    type: list
    default: []
    label: Extra read-only tools
    description: Exact tool names you vouch for as read-only. Plan mode lets them run while planning.
